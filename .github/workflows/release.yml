name: 跨平台桌面端构建与发布

on:
  push:
    tags:
      - 'v*'         # 打 tag 自动触发全平台构建并发布 Release

  workflow_dispatch: # 手动触发，可选平台
    inputs:
      platform:
        description: '构建平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all          # macOS ARM + macOS Intel + Windows
          - macos-arm    # macOS Apple Silicon (M1/M2/M3)
          - macos-intel  # macOS Intel (x86_64)
          - windows      # Windows x64
      release_tag:
        description: '发布到 Release 的 tag（如 v1.0.5），留空则只上传 artifact'
        required: false
        default: ''
      draft:
        description: '是否草稿（Draft）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # macOS Apple Silicon
  # ──────────────────────────────────────────────────────────────────────────
  build-macos-arm:
    name: macOS Apple Silicon
    # tag push 时始终运行；手动触发时仅 all 或 macos-arm 才运行
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos-arm'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './frontend/src-tauri -> target' }

      - name: 打包 Python 后端 sidecar
        env:
          TARGET_TRIPLE: aarch64-apple-darwin
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python build_backend.py

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target aarch64-apple-darwin'
          # tag push 用 git tag 名；手动填了 tag 就用输入值；否则不创建 Release
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          releaseName: ${{ github.event_name == 'push' && format('抖音联络官 {0}', github.ref_name) || (inputs.release_tag != '' && format('抖音联络官 {0}', inputs.release_tag) || '') }}
          releaseBody: |
            ## 下载安装

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS Apple Silicon | `*_aarch64.dmg` | M芯片，双击安装 |
            | macOS Intel | `*_x64.dmg` | Intel 芯片，双击安装 |
            | Windows | `*_x64-setup.exe` | Windows 10/11，管理员运行 |

            > macOS 首次运行：系统偏好设置 → 安全性 → 仍要打开
          releaseDraft: ${{ inputs.draft == 'true' }}
          prerelease: false
          uploadWorkflowArtifacts: true   # 同时上传 artifact，无论是否发 Release

  # ──────────────────────────────────────────────────────────────────────────
  # macOS Intel
  # ──────────────────────────────────────────────────────────────────────────
  build-macos-intel:
    name: macOS Intel
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos-intel'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-apple-darwin }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './frontend/src-tauri -> target' }

      - name: 打包 Python 后端 sidecar
        env:
          TARGET_TRIPLE: x86_64-apple-darwin
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python build_backend.py

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target x86_64-apple-darwin'
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          releaseName: ${{ github.event_name == 'push' && format('抖音联络官 {0}', github.ref_name) || (inputs.release_tag != '' && format('抖音联络官 {0}', inputs.release_tag) || '') }}
          releaseBody: |
            ## 下载安装

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS Apple Silicon | `*_aarch64.dmg` | M 芯片，双击安装 |
            | macOS Intel | `*_x64.dmg` | Intel 芯片，双击安装 |
            | Windows | `*_x64-setup.exe` | Windows 10/11，管理员运行 |

            > macOS 首次运行：系统偏好设置 → 安全性 → 仍要打开
          releaseDraft: ${{ inputs.draft == 'true' }}
          prerelease: false
          uploadWorkflowArtifacts: true

  # ──────────────────────────────────────────────────────────────────────────
  # Windows x64
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './frontend/src-tauri -> target' }

      - name: 打包 Python 后端 sidecar
        env:
          TARGET_TRIPLE: x86_64-pc-windows-msvc
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python build_backend.py

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: ''
          tagName: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          releaseName: ${{ github.event_name == 'push' && format('抖音联络官 {0}', github.ref_name) || (inputs.release_tag != '' && format('抖音联络官 {0}', inputs.release_tag) || '') }}
          releaseBody: |
            ## 下载安装

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS Apple Silicon | `*_aarch64.dmg` | M 芯片，双击安装 |
            | macOS Intel | `*_x64.dmg` | Intel 芯片，双击安装 |
            | Windows | `*_x64-setup.exe` | Windows 10/11，管理员运行 |

            > macOS 首次运行：系统偏好设置 → 安全性 → 仍要打开
          releaseDraft: ${{ inputs.draft == 'true' }}
          prerelease: false
          uploadWorkflowArtifacts: true
