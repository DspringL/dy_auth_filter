name: 跨平台桌面端构建与发布

on:
  push:
    tags:
      - 'v*'           # 打 tag 时触发，如 v1.0.0
  workflow_dispatch:   # 支持手动触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          # macOS Intel
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          # Windows x64
          - platform: windows-latest
            args: ''
            rust_target: x86_64-pc-windows-msvc
          # Linux x64
          - platform: ubuntu-22.04
            args: ''
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      # ── 检出代码 ────────────────────────────────────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 配置 Node.js ────────────────────────────────────────────────────────
      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 配置 Python（用于打包后端） ──────────────────────────────────────────
      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 配置 Rust ───────────────────────────────────────────────────────────
      - name: 配置 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      # ── Linux 系统依赖 ──────────────────────────────────────────────────────
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── 安装 Python 后端依赖 ─────────────────────────────────────────────────
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 打包 Python 后端为可执行文件 ──────────────────────────────────────────
      - name: 打包 Python 后端
        run: python build_backend.py

      # ── 安装前端依赖 ─────────────────────────────────────────────────────────
      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      # ── 构建 Tauri 桌面应用 ───────────────────────────────────────────────────
      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名（可选，需要在 Secrets 中配置）
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./frontend
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: '抖音达人系统 ${{ github.ref_name }}'
          releaseBody: |
            ## 下载说明

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS (Apple Silicon) | `*_aarch64.dmg` | M1/M2/M3 芯片 |
            | macOS (Intel)         | `*_x64.dmg`     | Intel 芯片 |
            | Windows               | `*_x64-setup.exe` | Windows 10/11 |
            | Linux                 | `*_amd64.AppImage` | Ubuntu/Debian |

            首次运行前请阅读 README.md 中的安装说明。
          releaseDraft: true
          prerelease: false

  # ── 开发版构建（仅当前平台，不发布） ───────────────────────────────────────
  dev-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config
      - run: pip install -r requirements.txt pyinstaller
      - run: python build_backend.py
      - run: npm install
        working-directory: ./frontend
      - name: 构建调试版
        working-directory: ./frontend
        run: npx tauri build --debug
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-linux
          path: |
            frontend/src-tauri/target/debug/bundle/
          retention-days: 7
