name: 跨平台桌面端构建与发布

on:
  push:
    tags:
      - 'v*'           # 打 tag 时触发，如 v1.0.0
  workflow_dispatch:   # 支持手动触发

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 正式版多平台构建 + 发布 Release（仅 tag 触发）
  # ────────────────────────────────────────────────────────────────────────────
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # 必须有写权限才能创建 Release 和上传资产
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          # macOS Intel
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          # Windows x64
          - platform: windows-latest
            args: ''
            rust_target: x86_64-pc-windows-msvc
          # Linux x64
          - platform: ubuntu-22.04
            args: ''
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      # ── 检出代码 ─────────────────────────────────────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 配置 Node.js ──────────────────────────────────────────────────────────
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # ── 配置 Python（用于打包后端 sidecar） ────────────────────────────────────
      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 配置 Rust stable ─────────────────────────────────────────────────────
      - name: 配置 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      # ── Linux 系统依赖 ────────────────────────────────────────────────────────
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            xdg-utils

      # ── 安装 Python 后端依赖 + 打包为 sidecar ──────────────────────────────────
      # TARGET_TRIPLE 告诉 build_backend.py 输出哪个平台的 sidecar 文件名
      # macOS 交叉编译时 runner 架构与目标架构不同，必须显式传入
      - name: 安装 Python 依赖并打包后端
        env:
          TARGET_TRIPLE: ${{ matrix.rust_target }}
          PYTHONUTF8: "1"          # Windows: 强制 Python I/O 使用 UTF-8
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python build_backend.py

      # ── 安装前端依赖 ──────────────────────────────────────────────────────────
      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      # ── 构建 Tauri 桌面应用并发布 Release ────────────────────────────────────
      - name: 构建 Tauri 应用并上传到 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: '抖音达人系统 ${{ github.ref_name }}'
          releaseBody: |
            ## 下载说明

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | macOS (Apple Silicon) | `*_aarch64.dmg` | M1/M2/M3 芯片 |
            | macOS (Intel)         | `*_x64.dmg`     | Intel 芯片 |
            | Windows               | `*_x64-setup.exe` | Windows 10/11 |
            | Linux                 | `*_amd64.AppImage` | Ubuntu/Debian |

            首次运行前请阅读 README.md 中的安装说明。
          releaseDraft: true
          prerelease: false

  # ────────────────────────────────────────────────────────────────────────────
  # 开发版构建（手动触发，仅 Linux debug，上传为 workflow artifact）
  # ────────────────────────────────────────────────────────────────────────────
  dev-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 配置 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            xdg-utils

      - name: 安装 Python 依赖并打包后端
        env:
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python build_backend.py

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      - name: 构建调试版（不发布 Release）
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--debug'
          uploadWorkflowArtifacts: true

      - name: 说明产物位置
        run: |
          echo "✅ 调试构建完成，产物已上传为 workflow artifacts"
          echo "前往 Actions 页面 → 本次运行 → Artifacts 下载"
