            | macOS Intel | `*_x64.dmg` | Intel 芯片，双击安装 |
            | Windows | `*_x64-setup.exe` | Windows 10/11 |

            > macOS 首次运行：系统设置 → 隐私与安全性 → 仍然允许
          releaseDraft: ${{ inputs.draft == 'true' }}
          prerelease: false
