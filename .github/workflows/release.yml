name: 跨平台桌面端构建与发布

on:
  push:
    tags:
      - 'v*'         # 打 tag 自动触发全平台构建

  workflow_dispatch: # 手动触发，可选平台
    inputs:
      platform:
        description: '构建平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm
          - macos-intel
          - windows
      release_tag:
        description: '发布到 Release 的 tag（如 v1.0.10），留空则只上传 artifact'
        required: false
        default: ''
      draft:
        description: '是否草稿'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # ── 第一步：创建 Release（仅 tag push 时）──────────────────────────────────
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: 创建 GitHub Release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            // 先尝试获取已有 release，避免重复创建
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })
              core.setOutput('id', String(existing.data.id))
              console.log('复用已有 Release id=' + existing.data.id)
              return
            } catch {}
            // 不存在则创建
            const res = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `抖音达人联络官 ${tag}`,
              body: `## 下载安装\n\n| 平台 | 文件 | 说明 |\n|------|------|------|\n| macOS Apple Silicon | \`*_aarch64.dmg\` | M1/M2/M3 芯片 |\n| macOS Intel | \`*_x64.dmg\` | Intel 芯片 |\n| Windows | \`*_x64-setup.exe\` | Windows 10/11 |\n\n> macOS 首次运行：系统偏好设置 → 安全性 → 仍要打开`,
              draft: true,
              prerelease: false,
            })
            core.setOutput('id', String(res.data.id))
            console.log('新建 Release id=' + res.data.id)

  # ── macOS Apple Silicon ──────────────────────────────────────────────────
  build-macos-arm:
    name: macOS Apple Silicon
    needs: [create-release]
    if: |
      always() &&
      (github.event_name == 'push' ||
       inputs.platform == 'all' ||
       inputs.platform == 'macos-arm')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './frontend/src-tauri -> target' }

      - name: 打包 Python 后端 sidecar
        env:
          TARGET_TRIPLE: aarch64-apple-darwin
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python build_backend.py

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      - name: 构建并上传到 Release（tag push）
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target aarch64-apple-darwin'
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadWorkflowArtifacts: true

      - name: 构建并上传到 Release（手动指定 tag）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target aarch64-apple-darwin'
          tagName: ${{ inputs.release_tag }}
          releaseName: '抖音达人联络官 ${{ inputs.release_tag }}'
          releaseDraft: ${{ inputs.draft == 'true' }}
          uploadWorkflowArtifacts: true

      - name: 仅构建不发布（手动无 tag）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target aarch64-apple-darwin'
          uploadWorkflowArtifacts: true

  # ── macOS Intel ──────────────────────────────────────────────────────────
  build-macos-intel:
    name: macOS Intel
    needs: [create-release]
    if: |
      always() &&
      (github.event_name == 'push' ||
       inputs.platform == 'all' ||
       inputs.platform == 'macos-intel')
    runs-on: macos-15-intel  # Intel x86_64 runner（macos-13 资源池已萎缩，官方推荐 macos-15-intel）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-apple-darwin }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './frontend/src-tauri -> target' }

      - name: 打包 Python 后端 sidecar
        env:
          TARGET_TRIPLE: x86_64-apple-darwin
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python build_backend.py

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      - name: 构建并上传到 Release（tag push）
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target x86_64-apple-darwin'
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadWorkflowArtifacts: true

      - name: 构建并上传到 Release（手动指定 tag）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target x86_64-apple-darwin'
          tagName: ${{ inputs.release_tag }}
          releaseName: '抖音达人联络官 ${{ inputs.release_tag }}'
          releaseDraft: ${{ inputs.draft == 'true' }}
          uploadWorkflowArtifacts: true

      - name: 仅构建不发布（手动无 tag）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target x86_64-apple-darwin'
          uploadWorkflowArtifacts: true

  # ── Windows x64 ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    needs: [create-release]
    if: |
      always() &&
      (github.event_name == 'push' ||
       inputs.platform == 'all' ||
       inputs.platform == 'windows')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './frontend/src-tauri -> target' }

      - name: 打包 Python 后端 sidecar
        env:
          TARGET_TRIPLE: x86_64-pc-windows-msvc
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python build_backend.py

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      - name: 构建并上传到 Release（tag push）
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: ''
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadWorkflowArtifacts: true

      - name: 构建并上传到 Release（手动指定 tag）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: ''
          tagName: ${{ inputs.release_tag }}
          releaseName: '抖音达人联络官 ${{ inputs.release_tag }}'
          releaseDraft: ${{ inputs.draft == 'true' }}
          uploadWorkflowArtifacts: true

      - name: 仅构建不发布（手动无 tag）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: ''
          uploadWorkflowArtifacts: true

  # ── 所有平台完成后发布 Release（去掉草稿）────────────────────────────────
  publish-release:
    name: 发布 Release
    needs: [create-release, build-macos-arm, build-macos-intel, build-windows]
    if: github.event_name == 'push' && always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 将 Release 从草稿改为正式发布
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = ${{ needs.create-release.outputs.release_id }}
            // 只有所有 build job 都成功才正式发布
            const allSuccess = ['${{ needs.build-macos-arm.result }}',
                                '${{ needs.build-macos-intel.result }}',
                                '${{ needs.build-windows.result }}'].every(r => r === 'success')
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: !allSuccess,   // 有失败则保持草稿
            })
            console.log(allSuccess ? '✅ Release 已正式发布' : '⚠️ 部分平台构建失败，Release 保持草稿状态')
