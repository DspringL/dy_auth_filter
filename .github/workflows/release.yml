name: 跨平台桌面端构建与发布

on:
  push:
    tags:
      - 'v*'          # 打 tag 时自动触发全平台构建

  workflow_dispatch:  # 手动触发，可选平台
    inputs:
      platform:
        description: '选择构建平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all           # macOS ARM + macOS Intel + Windows
          - macos-arm     # macOS Apple Silicon (M1/M2/M3)
          - macos-intel   # macOS Intel (x86_64)
          - windows       # Windows x64
      release_tag:
        description: '发布到哪个 Release tag（如 v1.0.4），留空则只上传 artifact'
        required: false
        default: ''
      draft:
        description: '发布为草稿？'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# ──────────────────────────────────────────────────────────────────────────────
# macOS Apple Silicon
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build-macos-arm:
    name: 构建 macOS Apple Silicon
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      inputs.platform == 'all' ||
      inputs.platform == 'macos-arm'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RUST_TARGET: aarch64-apple-darwin
      TAURI_ARGS: '--target aarch64-apple-darwin'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: 打包 Python 后端 sidecar
        env:
          TARGET_TRIPLE: aarch64-apple-darwin
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python build_backend.py

      - name: 安装前端依赖
        working-directory: ./frontend
        run: npm install

      - name: 构建并发布（有 tag）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target aarch64-apple-darwin'
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          releaseName: '抖音达人系统 ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}'
          releaseBody: |
            ## 下载安装

            | 平台 | 文件名 | 说明 |
            |------|--------|------|
            | macOS Apple Silicon | `*_aarch64.dmg` | M1/M2/M3，双击安装 |
            | macOS Intel | `*_x64.dmg` | Intel 芯片，双击安装 |
            | Windows | `*_x64-setup.exe` | Windows 10/11 |

            > macOS 首次运行：系统设置 → 隐私与安全性 → 仍然允许
          releaseDraft: ${{ inputs.draft == 'true' }}
          prerelease: false
          uploadWorkflowArtifacts: true

      - name: 仅构建不发布（无 tag）
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          args: '--target aarch64-apple-darwin'
          uploadWorkflowArtifacts: true

      - name: 打印下载地址
        shell: bash
        run: |
          echo "================================================"
          echo "✅ macOS ARM 构建完成"
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            echo "📦 Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "📦 Release: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}"
          else
            echo "📦 Artifact: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          echo "================================================"

